apiVersion: v2
parts:
  - name: ExamplePart
    components:
      - name: ConfigMaps
        allOf:
          - path: cm-mismatch.yaml
            config:
              perField:
                - pathToKey: data.regex
                  inlineDiffFunc: regex
                  inlineDiffOptions:
                    - ignoreReferenceSlashCommentLines
                    - ignoreReferenceHashCommentLines
                - pathToKey: data.capturegroups
                  inlineDiffFunc: capturegroups
                  inlineDiffOptions:
                    - ignoreReferenceHashCommentLines
                    - ignoreReferenceSlashCommentLines
